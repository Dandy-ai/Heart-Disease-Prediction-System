{% extends "base.html" %}
{% block title %}Login – HeartPredict{% endblock %}
{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card border-0 shadow-sm mt-3">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <i class="fa-solid fa-heart-pulse fa-3x text-danger mb-3"></i>
            <h4 class="fw-bold">Welcome Back</h4>
            <p class="text-muted small">Sign in to your HeartPredict account</p>
          </div>
          <form method="POST" action="{{ url_for('login') }}" novalidate>
            <div class="mb-3">
              <label class="form-label fw-semibold" for="username">
                <i class="fa-solid fa-user me-1 text-muted"></i>Username
              </label>
              <input type="text" class="form-control form-control-lg" id="username"
                     name="username" placeholder="Enter username" required autofocus/>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold" for="password">
                <i class="fa-solid fa-lock me-1 text-muted"></i>Password
              </label>
              <div class="input-group">
                <input type="password" class="form-control form-control-lg" id="password"
                       name="password" placeholder="Enter password" required/>
                <button class="btn btn-outline-secondary" type="button" id="togglePwd"
                        onclick="togglePassword('password','togglePwd')">
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>
            </div>
            <div class="mb-4 d-flex justify-content-between align-items-center">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember" name="remember"/>
                <label class="form-check-label small" for="remember">Remember me</label>
              </div>
            </div>
            <button type="submit" class="btn btn-primary-custom btn-lg w-100">
              <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
            </button>
          </form>
          <hr class="my-4"/>
          <p class="text-center text-muted small mb-0">
            Don't have an account?
            <a href="{{ url_for('register') }}" class="fw-semibold text-decoration-none">Register here</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function togglePassword(inputId, btnId) {
  const input = document.getElementById(inputId);
  const btn   = document.getElementById(btnId);
  if (input.type === 'password') {
    input.type = 'text';
    btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
  } else {
    input.type = 'password';
    btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
  }
}
</script>
{% endblock %}
